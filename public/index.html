<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --accent: #4f46e5; --good: #059669; --good-bg: #ecfdf5; --bad: #dc2626; --bad-bg: #fef2f2;
    --warn: #b45309; --warn-bg: #fffbeb; --chip: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1020; --panel: #121a2e; --ink: #e2e8f0; --muted: #94a3b8; --line: #1f2a44;
      --accent: #818cf8; --good: #34d399; --good-bg: #06291f; --bad: #f87171; --bad-bg: #2a0f14;
      --warn: #fbbf24; --warn-bg: #2a1f06; --chip: #1a2440;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  .logo { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .logo b { color: var(--accent); }
  .pill { font: 500 12px/1 "JetBrains Mono", monospace; padding: 6px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .pill.ok { background: var(--good-bg); color: var(--good); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .sp { flex: 1; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 48px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .v { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .d { font: 500 12px "JetBrains Mono", monospace; margin-top: 4px; min-height: 16px; color: var(--muted); }
  .kpi .d.down { color: var(--bad); } .kpi .d.up { color: var(--warn); }
  .kpi.changed { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
  .alerts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .alert { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); background: var(--panel); }
  .alert.warn { background: var(--warn-bg); border-color: transparent; }
  .alert.bad { background: var(--bad-bg); border-color: var(--bad); }
  .alert h3 { margin: 0 0 4px; font-size: 13px; }
  .alert p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 12px; }
  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  section.card > h2 { margin: 0; padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  section.card > h2 .s { color: var(--muted); font-weight: 400; }
  .scroll { max-height: 360px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); }
  .st { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .st.captured { color: var(--good); } .st.refunded { color: var(--warn); } .st.failed { color: var(--bad); }
  .err { padding: 14px 16px; color: var(--bad); background: var(--bad-bg); font: 12px "JetBrains Mono", monospace; }
  .empty { padding: 14px 16px; color: var(--muted); }
  @media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } .grid, .alerts { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { header, main { padding-left: 16px; padding-right: 16px; } .kpis { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="logo">ledger<b>ly</b></div>
  <span class="pill" id="env">prod</span>
  <span class="sp"></span>
  <span class="pill" id="version">schema …</span>
  <span class="pill" id="status">connecting…</span>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="alerts" id="alerts"></div>
  <div class="grid">
    <section class="card"><h2>Recent payments <span class="s">latest 50</span></h2><div class="scroll" id="recent_payments"></div></section>
    <section class="card"><h2>Refunds <span class="s">latest 50</span></h2><div class="scroll" id="customer_refunds"></div></section>
  </div>
  <div class="grid">
    <section class="card"><h2>Merchant settlement <span class="s">top 20 payable</span></h2><div class="scroll" id="merchant_settlement"></div></section>
    <section class="card"><h2>Double charges <span class="s">same UPI transaction charged twice</span></h2><div class="scroll" id="double_charges"></div></section>
  </div>
</main>
<script>
const inr = (v) => "₹" + Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (v) => Number(v).toLocaleString("en-IN");
const esc = (s) => String(s ?? "—").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const time = (t) => new Date(t).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
let baseline = null; // KPI values when this page was opened, to show what changed underneath
let baselineAt = null;

function table(q, cols) {
  if (!q.ok) return `<div class="err">query failed: ${esc(q.error)}</div>`;
  if (!q.rows.length) return `<div class="empty">No rows.</div>`;
  const head = cols.map(([l, , cls]) => `<th${cls === "n" ? ' style="text-align:right"' : ""}>${l}</th>`).join("");
  const body = q.rows.map((r) => `<tr>${cols.map(([, f, cls]) => `<td class="${cls || ""}">${f(r)}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function kpi(label, value, key, fmt) {
  let d = "", cls = "";
  if (baseline && key in baseline && Number(baseline[key]) !== Number(value)) {
    const diff = Number(value) - Number(baseline[key]);
    cls = diff < 0 ? "down" : "up";
    d = `${diff < 0 ? "▼" : "▲"} ${fmt(Math.abs(diff))} since ${baselineAt}`;
  }
  return `<div class="kpi${d ? " changed" : ""}"><div class="l">${label}</div><div class="v">${fmt(value)}</div><div class="d ${cls}">${d}</div></div>`;
}

async function refresh() {
  let data;
  try { data = await (await fetch("/api/overview")).json(); }
  catch { document.getElementById("status").className = "pill bad"; document.getElementById("status").textContent = "app down"; return; }
  const q = data.queries;
  const status = document.getElementById("status");
  const failing = Object.values(q).filter((x) => !x.ok).length;
  status.className = "pill " + (failing ? "bad" : "ok");
  status.textContent = failing ? `${failing} quer${failing > 1 ? "ies" : "y"} failing` : "all queries ok";
  document.getElementById("version").textContent = data.health.ok ? `schema ${data.health.version}` : "schema ?";

  const t = q.dashboard_totals.ok ? q.dashboard_totals.rows[0] : null;
  if (t && !baseline) { baseline = { ...t }; baselineAt = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }); }
  document.getElementById("kpis").innerHTML = t
    ? kpi("Payments", t.payments, "payments", num) + kpi("Gross volume", t.gross_volume, "gross_volume", inr) +
      kpi("Refunds issued", t.refunds, "refunds", num) + kpi("Refunded", t.refunded, "refunded", inr)
    : `<div class="kpi" style="grid-column:1/-1"><div class="err">dashboard query failed: ${esc(q.dashboard_totals.error)}</div></div>`;

  const dc = q.double_charges, un = q.unattributed_payments;
  const alerts = [];
  if (dc.ok && dc.rows.length) {
    const unrefunded = dc.rows.filter((r) => Number(r.refunded) === 0).length;
    alerts.push(`<div class="alert warn"><h3>${dc.rows.length} customers charged twice (UPI retry bug)</h3><p>${dc.rows.length - unrefunded} already refunded · ${unrefunded} still owed a refund</p></div>`);
  }
  if (baseline && t && Number(t.refunds) < Number(baseline.refunds)) {
    alerts.push(`<div class="alert bad"><h3>${num(baseline.refunds - t.refunds)} refund records disappeared</h3><p>${inr(baseline.refunded - t.refunded)} of refunds customers received is no longer in the ledger.</p></div>`);
  }
  if (un.ok) {
    const u = un.rows[0];
    alerts.push(`<div class="alert"><h3>Unattributed payments</h3><p>${num(u.unknown_customer)} with an unknown customer · ${num(u.no_merchant)} with no merchant (legacy POS)</p></div>`);
  }
  document.getElementById("alerts").innerHTML = alerts.join("");

  document.getElementById("recent_payments").innerHTML = table(q.recent_payments, [
    ["When", (r) => time(r.created_at)], ["Customer", (r) => esc(r.customer)], ["Merchant", (r) => esc(r.merchant)],
    ["Status", (r) => `<span class="st ${r.status}">${r.status}</span>`], ["Amount", (r) => inr(r.amount), "n"]]);
  document.getElementById("customer_refunds").innerHTML = table(q.customer_refunds, [
    ["When", (r) => time(r.created_at)], ["Customer", (r) => esc(r.customer)], ["Reason", (r) => esc(r.reason)], ["Amount", (r) => inr(r.amount), "n"]]);
  document.getElementById("merchant_settlement").innerHTML = table(q.merchant_settlement, [
    ["Merchant", (r) => esc(r.name)], ["City", (r) => esc(r.city)], ["Payments", (r) => num(r.payments), "n"], ["Payable", (r) => inr(r.payable), "n"]]);
  document.getElementById("double_charges").innerHTML = table(dc, [
    ["UPI ref", (r) => esc(r.upi_txn_ref), "mono"], ["Customer", (r) => esc(r.customer)], ["Charged", (r) => inr(r.charged), "n"],
    ["Refunded", (r) => Number(r.refunded) ? inr(r.refunded) : `<span style="color:var(--bad)">none</span>`, "n"]]);
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
